<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voxel Adventure</title><link rel="stylesheet" href="style.css"></head><body><canvas id="world"></canvas><main>
<section id="start" class="panel"><p>VOXEL ADVENTURE</p><h1>A world worth wandering.</h1><div id="modes"><button data-mode="survival" class="on"><b>Survival</b><small>Gather and craft</small></button><button data-mode="creative"><b>Creative</b><small>Unlimited blocks</small></button><button data-mode="peaceful"><b>Peaceful</b><small>Explore freely</small></button></div><button id="begin">Begin adventure</button><small>WASD move · Space jump · Tab backpack · P third-person</small></section>
<section id="hud" hidden><div id="top"><span id="biome">Oakwood Valley</span><span id="mode">SURVIVAL</span><span>Tab: backpack & crafting</span></div><div id="hearts">♥ ♥ ♥ ♥ ♥</div><div id="cross">+</div><div id="bar"></div></section>
